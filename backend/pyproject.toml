[project]
name = "mirofish-fintech-backend"
version = "0.1.0"
description = "Argentina fintech behavior simulator adapted from MiroFish"
requires-python = ">=3.11"
dependencies = [
  "flask==3.0.3",
  "flask-cors==5.0.0",
  "python-dotenv==1.0.1",
  "openai==1.102.0",
  "requests==2.32.3",
  "feedparser==6.0.11",
  "beautifulsoup4==4.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
